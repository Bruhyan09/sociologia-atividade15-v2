databases:
  - name: sociotab-db
    plan: free
    databaseName: sociotab
    user: sociotab

services:
  - type: web
    name: sociotab
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: sociotab-db
          property: connectionString
      - key: LOCK_TTL_SECONDS
        value: "90"
